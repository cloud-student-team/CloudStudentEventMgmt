name: Deploy Frontend to Azure
on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/deploy-frontend.yml']
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: ./frontend
      - run: npm run build
        working-directory: ./frontend
        env:
          CI: "false"
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
      - run: |
          cat > build/server.js << 'EOF'
          const express = require('express');
          const path = require('path');
          const app = express();
          const PORT = process.env.PORT || 8080;
          app.use(express.static(path.join(__dirname)));
          app.get('*', (req, res) => res.sendFile(path.join(__dirname, 'index.html')));
          app.listen(PORT, () => console.log('Frontend on port ' + PORT));
          EOF
          cat > build/package.json << 'EOF'
          {"name":"frontend-build","version":"1.0.0","scripts":{"start":"node server.js"},"dependencies":{"express":"^4.18.2"}}
          EOF
          npm install --prefix build
        working-directory: ./frontend
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.FRONTEND_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
          package: ./frontend/build
